<!DOCTYPE html>
<html>
<head>
  <title>Live Face Check</title>
</head>
<body>

<h2>Face Verification</h2>
<p id="status">Initializing camera...</p>
<video id="video" autoplay playsinline muted width="300"></video>

<script>
const video = document.getElementById("video");
const statusText = document.getElementById("status");

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    statusText.innerText = "Camera ready. Blink your eyes.";
  });

async function captureFrame() {
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.8));
}

async function startLivenessCheck() {
  statusText.innerText = "Please blink your eyes...";

  const formData = new FormData();

  for (let i = 0; i < 7; i++) {
    const blob = await captureFrame();
    formData.append("frames", blob);
    await new Promise(r => setTimeout(r, 100));
  }

  const res = await fetch("/api/face_login/", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  statusText.innerText = data.message;

  if (!data.success) {
    setTimeout(startLivenessCheck, 500);
  }
}

setTimeout(startLivenessCheck, 500);
</script>

</body>
</html>
