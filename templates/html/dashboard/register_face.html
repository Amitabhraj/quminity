{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quminity | Secure Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root { 
            --primary: #3a7bd5; 
            --success: #27ae60; 
            --error: #e74c3c; 
            --bg: #f8fafc;
            --text-main: #2d3436;
        }

        body { 
            background-color: var(--bg); 
            min-height: 100vh; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: var(--text-main);
            margin: 0; 
        }
        
        .navbar { background: #ffffff; box-shadow: 0 2px 0px rgba(0,0,0,0.05); padding: 5px 0; }
        .navbar .container { display: flex; justify-content: flex-start; }
        .nav-logo { height: 60px; border-radius: 100%; object-fit: contain; }

        .main-container { height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .glass-card { 
            background: #ffffff; border-radius: 24px; padding: 45px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.07); width: 100%; 
            max-width: 460px; text-align: center; border: 1px solid #edf2f7;
        }

        .cam-outer { 
            position: relative; width: 270px; height: 270px; margin: 0 auto 25px; 
            border-radius: 50%; overflow: hidden; border: 5px solid #f1f5f9; 
            background: #000; transition: all 0.4s ease;
        }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .timer-badge { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            background: var(--text-main); color: #fff; padding: 5px 16px; 
            border-radius: 20px; font-weight: 700; font-size: 0.85rem; z-index: 10;
        }

        .status-scanning { border-color: var(--primary); box-shadow: 0 0 20px rgba(58, 123, 213, 0.2); }
        .status-error { border-color: var(--error) !important; box-shadow: 0 0 20px rgba(231, 76, 60, 0.2); }
        .status-success { border-color: var(--success) !important; box-shadow: 0 0 20px rgba(39, 174, 96, 0.2); }

        .form-control { 
            background: #fdfdfd; border: 1px solid #e2e8f0; border-radius: 12px; 
            padding: 12px 16px; color: var(--text-main); margin-bottom: 15px; transition: 0.3s;
        }
        
        .btn-primary { background: var(--primary); border: none; border-radius: 12px; padding: 14px; font-weight: 700; }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }

        .status-text { font-weight: 800; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1.5px; color: #64748b; margin-top: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="{% static 'images/logo/quminity.jpg' %}" alt="Quminity" class="nav-logo">
        </a>
    </div>
</nav>

<div class="main-container">
    {% csrf_token %}
    <div class="glass-card animate__animated animate__fadeInUp">
        
        <div id="sectionForm">
            <h4 class="fw-bold mb-1">Face Registration</h4>
            <p class="text-muted small mb-4">Complete your secure profile setup</p>
            
            <input type="number" id="qid" class="form-control" placeholder="Enter Your QID">
            <input type="text" id="name" class="form-control" placeholder="Full Name">
            
            <div class="input-group mb-3">
                <input type="email" id="email" class="form-control mb-0" style="border-radius: 12px 0 0 12px;" placeholder="Email Address" oninput="toggleSendBtn()">
                <button class="btn btn-dark px-3" type="button" style="border-radius: 0 12px 12px 0;" onclick="handleOTP('send')" id="btnSend" disabled>
                  <span class="spinner-border spinner-border-sm" id="spinnerSend" aria-hidden="true" hidden></span>
                  <span id="textSend">Send OTP</span>
                </button>
            </div>

            <div id="otpWrapper" class="hidden animate__animated animate__fadeIn">
                <div class="input-group mb-3">
                    <input type="text" id="otp" class="form-control mb-0" style="border-radius: 12px 0 0 12px;" placeholder="Code">
                    <button class="btn btn-success" type="button" style="border-radius: 0 12px 12px 0;" onclick="handleOTP('verify')" id="btnVerify">
                        <span class="spinner-border spinner-border-sm" id="spinnerVerify" aria-hidden="true" hidden></span>
                        <span id="textVerify">Verify</span>
                    </button>
                </div>
            </div>

            <button id="btnNext" class="btn btn-success w-100 py-3 mt-2" disabled onclick="startBiometrics()">
                PROCEED TO FACE SCAN
            </button>
        </div>

        <div id="sectionCamera" class="hidden">
            <h5 class="fw-bold mb-4">Verifying Identity...</h5>
            <div class="cam-outer status-scanning" id="camWrap">
                <div id="timer" class="timer-badge">15s</div>
                <video id="video" autoplay playsinline muted></video>
            </div>
            <div id="statusLabel" class="status-text animate__animated animate__pulse animate__infinite">Initializing Camera...</div>
            <button id="btnRetry" class="btn btn-outline-danger btn-sm mt-4 px-4 rounded-pill" onclick="restartCamera()">RESTART SCAN</button>
        </div>
    </div>
</div>

<script>
    let timeLeft = 15, timerInterval, isProcessing = false;
    let otpSent = false;
    const getCSRF = () => document.querySelector('[name=csrfmiddlewaretoken]').value;

    function toggleSendBtn() {
        const email = document.getElementById('email').value;
        const btn = document.getElementById('btnSend');
        const isValid = email.includes('@') && email.includes('.');
        if(!otpSent) {
            btn.disabled = !isValid;
        }
    }

    async function handleOTP(mode) {
        const btn = mode === 'send' ? document.getElementById('btnSend') : document.getElementById('btnVerify');
        const spinner = mode === 'send' ? document.getElementById('spinnerSend') : document.getElementById('spinnerVerify');
        const text = mode === 'send' ? document.getElementById('textSend') : document.getElementById('textVerify');

        btn.disabled = true;
        spinner.hidden = false;
        text.innerText = mode === 'send' ? ' Sending...' : ' Verifying...';

        const fd = new FormData();
        fd.append('action', mode === 'send' ? 'send_otp' : 'verify_otp');
        fd.append('email', document.getElementById('email').value);
        if(mode === 'verify') fd.append('otp', document.getElementById('otp').value);

        try {
            const res = await fetch("/api/face_register/", { method: 'POST', body: fd, headers: {"X-CSRFToken": getCSRF()} });
            const data = await res.json();
            
            if(data.success) {
                if(mode === 'send') {
                    otpSent = true; 
                    document.getElementById('otpWrapper').classList.remove('hidden');
                    text.innerText = 'OTP Sent ✔️';
                    btn.className = "btn btn-secondary px-3"; 
                } else {
                    document.getElementById('btnNext').disabled = false;
                    text.innerText = 'Verified ✔️';
                    btn.className = "btn btn-outline-success";
                }
            } else {
                alert(data.message);
                if(mode === 'send') {
                    btn.disabled = false;
                    text.innerText = 'Send OTP';
                } else {
                    btn.disabled = false;
                    text.innerText = 'Verify';
                }
            }
        } catch (e) { 
            alert("Network Error"); 
            btn.disabled = false;
            text.innerText = mode === 'send' ? 'Send OTP' : 'Verify';
        } finally {
            spinner.hidden = true;
        }
    }

    function startBiometrics() {
        document.getElementById('sectionForm').classList.add('hidden');
        document.getElementById('sectionCamera').classList.remove('hidden');
        initCamera();
    }

    function clearSession(){
        const body = new FormData();
        body.append("action", "clear_session");
        fetch("/api/face_register/", { method: "POST", body: body, headers: {"X-CSRFToken": getCSRF()} });
    }

    function restartCamera() {
        initCamera();
        clearSession();
    }

    async function initCamera() {
        timeLeft = 15; isProcessing = true;
        document.getElementById('btnRetry').classList.add('hidden');
        document.getElementById('camWrap').className = "cam-outer status-scanning";
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 640 } });
            document.getElementById('video').srcObject = s;
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = (timeLeft < 10 ? `0${timeLeft}s` : `${timeLeft}s`);
                if(timeLeft <= 0) finalize("SCAN TIMEOUT", "error");
            }, 1000);
            scanLoop();
        } catch (e) { document.getElementById('statusLabel').innerText = "CAMERA BLOCKED"; }
    }

    async function scanLoop() {
        if(!isProcessing) return;
        const canvas = document.createElement("canvas");
        canvas.width = 400; canvas.height = 400;
        canvas.getContext("2d").drawImage(document.getElementById('video'), 0, 0, 400, 400);
        const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.7));

        const fd = new FormData();
        fd.append("action", "register_face");
        fd.append("frame", blob);
        fd.append("qid", document.getElementById('qid').value);
        fd.append("name", document.getElementById('name').value);
        fd.append("email", document.getElementById('email').value);

        try {
            const res = await fetch("/api/face_register/", { method: "POST", body: fd, headers: {"X-CSRFToken": getCSRF()} });
            const data = await res.json();

            if(data.registered) {
                finalize(data.message, "success");
                setTimeout(() => window.location.href = "/", 2000);
                return;
            }

            document.getElementById('statusLabel').innerText = data.message;
            document.getElementById('camWrap').className = `cam-outer ${data.success === false ? 'status-error' : 'status-scanning'}`;

            if(isProcessing) setTimeout(scanLoop, 200);
        } catch (e) { if(isProcessing) setTimeout(scanLoop, 500); }
    }

    function finalize(m, s) {
        isProcessing = false; clearInterval(timerInterval);
        document.getElementById('statusLabel').innerText = m;
        document.getElementById('camWrap').className = `cam-outer status-${s}`;
        if(s === 'error') document.getElementById('btnRetry').classList.remove('hidden');
    }
</script>
</body>
</html>
