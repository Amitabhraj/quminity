{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quminity | Secure Access</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/@fortawesome/fontawesome-free/css/all.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            min-height: 100vh;
            background: #f0f3f8;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevents scrollbars from floating icons */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===============================
           STUDY FLOATING BACKGROUND
        ================================ */
        .study-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .study-icon {
            position: absolute;
            font-size: 40px;
            opacity: 0.7;
            animation: floatStudy 12s infinite ease-in-out;
        }

        @keyframes floatStudy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-35px) rotate(10deg); }
        }

        /* Position variations */
        .book1 { top: 10%; left: 10%; animation-delay: 0s; }
        .book2 { top: 75%; left: 12%; animation-delay: 2s; }
        .pen { top: 40%; left: 88%; animation-delay: 4s; }
        .bulb { top: 15%; left: 82%; animation-delay: 1s; }
        .brain { top: 65%; left: 85%; animation-delay: 5s; }
        .note { top: 85%; left: 45%; animation-delay: 3s; }

        /* ===============================
           SMART PORTAL CARD
        ================================ */
        .portal-card {
            position: relative;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 35px;
            padding: 45px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: white;
            padding: 5px;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        /* Action Buttons */
        .action-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 15px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .btn-face {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 12px 25px rgba(79, 172, 254, 0.3);
        }

        .btn-register {
            background: #ffffff;
            color: #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        .action-link:hover {
            transform: scale(1.04) translateY(-5px);
            color: inherit;
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 18px;
        }

        .btn-register .icon-box { background: #f0f4ff; color: #4facfe; }

        .text-box { text-align: left; }
        .text-box b { display: block; font-size: 17px; }
        .text-box span { font-size: 13px; opacity: 0.8; }

        /* Secondary Actions */
        .toggle-qid {
            background: none;
            border: none;
            color: #777;
            font-weight: 600;
            font-size: 14px;
            margin-top: 20px;
            cursor: pointer;
        }

        .toggle-qid:hover { color: #4facfe; }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #eee;
            background: rgba(255,255,255,0.8);
            margin-bottom: 12px;
        }

        .forgot-pass {
            font-size: 13px;
            color: #999;
            text-decoration: none;
            display: block;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="study-bg">
        <div class="study-icon book1">📘</div>
        <div class="study-icon book2">📕</div>
        <div class="study-icon pen">✏️</div>
        <div class="study-icon bulb">💡</div>
        <div class="study-icon brain">🧠</div>
        <div class="study-icon note">📓</div>
    </div>

    <div class="container d-flex justify-content-center">
        <div class="portal-card animate__animated animate__fadeInUp">
            
            <div class="logo-container">
                <img src="{% static 'images/logo/quminity.jpg' %}" alt="Q" class="w-100 h-100 rounded-circle">
            </div>

            <h3 class="fw-bold mb-1">Quminity Portal</h3>
            <p class="text-muted small mb-4">Secure Biometric Gateway</p>

            <div class="action-group">
                <a href="{% url 'face_login_page' %}" class="action-link btn-face">
                    <div class="icon-box"><i class="fas fa-fingerprint"></i></div>
                    <div class="text-box">
                        <b>Login with FACE</b>
                        <span>Instant secure access</span>
                    </div>
                </a>

                <a href="{% url 'face_register_page' %}" class="action-link btn-register">
                    <div class="icon-box"><i class="fas fa-id-card"></i></div>
                    <div class="text-box">
                        <b>Register Yourself</b>
                        <span>Setup biometric ID</span>
                    </div>
                </a>
            </div>

            <button class="toggle-qid" type="button" data-bs-toggle="collapse" data-bs-target="#qidCollapse">
                <i class="fas fa-lock me-2"></i> Use QID & Password
            </button>

            <div class="collapse" id="qidCollapse">
                <form method="POST" action="{% url 'user_login' %}" class="mt-3">
                    {% csrf_token %}
                    <input type="number" name="qid" class="form-control" placeholder="Enter QID">
                    <input type="password" name="password" class="form-control" placeholder="Password">
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Sign In</button>
                </form>
            </div>

            <a href="#" class="forgot-pass">Forgot Password?</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
