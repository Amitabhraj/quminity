<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quminity | Clubs & Events</title>
  {% load static %}

  <link rel="stylesheet" href="{% static 'css/libs.min.css' %}" />
  <link rel="stylesheet" href="{% static 'css/socialv.css' %}" />
  <link rel="stylesheet" href="{% static 'vendor/@fortawesome/fontawesome-free/css/all.min.css' %}" />
  <link rel="stylesheet" href="{% static 'vendor/remixicon/fonts/remixicon.css' %}" />

  <style>
    body {
      background: #f5f7fb;
      font-family: 'Poppins', sans-serif;
    }

    .page-header {
      text-align: center;
      padding: 30px 10px;
    }

    .page-header h2 {
      font-weight: 700;
      font-size: 30px;
      color: #2e2e2e;
    }

    .tabs-box {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .nav-tabs .nav-link {
      font-size: 17px;
      font-weight: 600;
      color: #555;
      border: none;
      padding: 12px 25px;
    }

    .nav-tabs .nav-link.active {
      color: #0d6efd;
      border-bottom: 3px solid #0d6efd;
      background: transparent;
    }

    .item-card {
      display: flex;
      align-items: center;
      padding: 18px;
      border-bottom: 1px solid #eee;
      transition: 0.3s;
    }

    .item-card:hover {
      background: #eef4ff;
    }

    .item-card img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    .item-info h5 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .item-info p {
      margin: 0;
      font-size: 14px;
      color: #777;
    }

    .action-buttons button {
      padding: 6px 14px;
      font-size: 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="iq-top-navbar">
    <div class="iq-navbar-custom">
      <nav class="navbar navbar-expand-lg navbar-light p-0">
        <div class="iq-navbar-logo d-flex justify-content-between">
          <a href="/">
            <img src="{% static 'images/logo/quminity.jpg' %}" style="height:75px;border-radius:40%;" />
          </a>
        </div>
      </nav>
    </div>
  </div>

  <div class="page-header">
    <h2>Clubs & Events Management</h2>
  </div>

  <div class="tabs-box">
    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="clubs-tab" data-bs-toggle="tab" data-bs-target="#clubs" type="button">Clubs</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="events-tab" data-bs-toggle="tab" data-bs-target="#events" type="button">Events</button>
      </li>
    </ul>

    <div class="tab-content mt-3">

      <!-- Clubs Tab -->
      <div class="tab-pane fade show active" id="clubs" role="tabpanel">
        {% for club in clubs %}
        <div class="item-card">
          <img src="{% static 'images/user/01.jpg' %}" />
          <div class="ms-3 item-info">
            <h5>{{club.club_name}}</h5>
            {% if club.president_name %}
            <p>President: {{club.president_name}}</p>
            {% endif %}
          </div>

          <div class="ms-auto action-buttons text-end">
            <a href="/manage-clubs"><button class="btn btn-success">Club Details</button></a>
          </div>
        </div>
        {% endfor %}
      </div>

      <!-- Events Tab -->
      <div class="tab-pane fade" id="events" role="tabpanel">
        {% for event in events %}
        <div class="item-card">
          <img src="{% static 'images/user/02.jpg' %}" />
          <div class="ms-3 item-info">
            <h5>{{event.event}}</h5>
            <p>Date: {{event.event_date}}</p>
          </div>

          <div class="ms-auto action-buttons text-end">
            <a href="/show-event-qr/{{event.id}}/"><button class="btn btn-primary">Generate QR</button></a>
            <a href="/manage-event/{{event.id}}/"><button class="btn btn-primary">Event Details</button></a>
          </div>
        </div>
        {% endfor %}
      </div>

    </div>
  </div>

  <script src="{% static 'js/libs.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
