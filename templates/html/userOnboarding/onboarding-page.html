{% extends 'html/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
    }
    
    .auth-card {
        width: 100%;
        max-width: 450px;
        padding: 2.5rem;
        border-radius: 10%;
        text-align: center;
        /* Enhancing the glass effect to stand out against the new background */
        background: rgba(253, 253, 253, 0.5) !important;
        border: 1px solid rgba(97, 97, 97, 0.4) !important;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
    }

    .auth-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 1.5rem;
        border-radius: 20px;
        box-shadow: 0 8px 16px rgba(102, 126, 234, 0.2);
        /* Subtle pulse animation for the logo */
        transition: transform 0.3s ease;
    }
    
    .auth-logo:hover {
        transform: scale(1.05);
    }

    .btn-auth {
        padding: 0.8rem 2rem;
        font-weight: 600;
        border-radius: 12px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        width: 100%;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 0.9rem;
    }

    .btn-login {
        background: var(--primary-gradient);
        color: white;
        border: none;
        box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
        color: white;
    }

    .btn-register {
        background: white;
        color: var(--text-dark);
        border: 2px solid #e5e7eb;
    }

    .btn-register:hover {
        background: #f9fafb;
        border-color: #667eea;
        color: #667eea;
    }

    .welcome-text {
        margin-bottom: 2rem;
    }

    .welcome-text h2 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
    }
    
    /* Responsive adjustment for mobile */
    @media (max-width: 480px) {
        .auth-card {
            padding: 2rem 1.5rem;
            margin: 1rem;
        }
    }
    .float-item {
        position: absolute;
        font-size: 3rem;
        color: rgba(128, 25, 230, 0.3);;
        z-index: 0;
        animation: floatMove 6s infinite ease-in-out;
    }

    @keyframes floatMove {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(10deg); }
    }

    .pos-1 { top: 10%; left: 5%; animation-delay: 0s; }
    .pos-2 { bottom: 10%; left: 10%; animation-delay: 2s; }
    .pos-3 { top: 15%; right: 5%; animation-delay: 4s; }
    .pos-4 { bottom: 15%; right: 10%; animation-delay: 1s; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <i class="fa fa-book float-item pos-1"></i>
    <i class="fa fa-pencil float-item pos-2"></i>
    <i class="fa fa-graduation-cap float-item pos-3"></i>
    <i class="fa fa-code float-item pos-4"></i>

    <div class="auth-card glass-card fade-in">
        <img src="{% static 'logo/quminity.png' %}" alt="Quminity" class="auth-logo">
        
        <div class="welcome-text">
            <h2 class="text-gradient">Welcome to Quminity</h2>
            <p class="text-muted small">Join your campus community today.</p>
        </div>

        <div class="auth-actions">
            <a href="{% url 'face_login_page' %}" class="btn btn-auth btn-login">
                <i class="fa fa-user"></i> FACE LOGIN
            </a>
            
            <div class="d-flex align-items-center my-3 text-muted">
                <hr class="flex-grow-1"> <span class="mx-2 small fw-bold">OR</span> <hr class="flex-grow-1">
            </div>

            <a href="{% url 'face_register_page' %}" class="btn btn-auth btn-register">
                <i class="bi bi-person-plus"></i>ENROLL IDENTITY
            </a>
        </div>
        
        <p class="mt-4 extra-small text-muted" style="font-size: 0.75rem;">
            By continuing, you agree to our <a href="/terms/" class="text-decoration-none">Terms of Service</a>.
        </p>
    </div>
</div>
{% endblock %}
