{% extends 'html/base.html' %}
{% load static %}

{% block content %}
<style>
    :root {
        --bg-main: #f8fafc;
        --card-bg: rgba(255, 255, 255, 0.8);
        --accent-primary: #0ea5e9;
        --text-dark: #1e293b;
        --text-muted: #64748b;
        --glass-border: rgba(0, 0, 0, 0.05);
    }

    /* --- FLOATING ELEMENTS (BLACK) --- */
    .floating-container {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
    }

    .float-item {
        position: absolute;
        font-size: 2.2rem;
        opacity: 0.6; /* Black with low opacity */
        color: #000000;
        animation: floating 8s infinite ease-in-out;
    }

    @keyframes floating {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-25px) rotate(15deg); }
    }

    .item-1 { top: 15%; left: 10%; animation-delay: 0s; }
    .item-2 { top: 70%; left: 15%; animation-delay: 2s; }
    .item-3 { top: 20%; left: 80%; animation-delay: 4s; }
    .item-4 { top: 75%; left: 85%; animation-delay: 1s; }

    /* --- PORTAL CARD --- */
    .portal-card {
        position: relative;
        z-index: 10;
        background: var(--card-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgb(163, 163, 163);
        border-radius: 100px;
        padding: 15px 25px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        width: 100%;
        margin-top: 0px;
        max-width: 450px;
        text-align: center;
    }

    .logo-box {
        width: 100px; height: 100px;
        margin: 0 auto 25px;
        padding: 5px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        border: 1px solid var(--glass-border);
    }
    .logo-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }

    /* --- INTERACTIVE BUTTONS --- */
    .action-link {
        text-decoration: none;
        display: flex;
        align-items: center;
        padding: 18px;
        border-radius: 20px;
        margin-bottom: 15px;
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid var(--glass-border);
        background: #ffffff;
        color: var(--text-dark);
    }

    .action-link:hover {
        transform: translateY(-3px);
        background: #ffffff;
        border-color: #000000;
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        color: #000000;
    }

    .icon-box {
        width: 48px; height: 48px;
        border-radius: 14px;
        background: #f1f5f9;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; margin-right: 15px;
        color: #000000;
        transition: 0.3s;
    }

    /* Primary Style for Face Login */
    .btn-face { border: 1px solid #000000; background: #000000 !important; color: #ffffff !important; }
    .btn-face .icon-box { background: rgba(255,255,255,0.2); color: #ffffff; }
    .btn-face:hover { background: #27272a !important; color: white !important; }

    .text-box { text-align: left; }
    .text-box b { display: block; font-size: 16px; font-weight: 800; }
    .text-box span { font-size: 12px; color: var(--text-muted); }
    .btn-face .text-box span { color: rgba(255,255,255,0.7); }

    .toggle-qid {
        background: none; border: none;
        color: var(--text-muted); font-weight: 700; font-size: 11px;
        margin-top: 20px; letter-spacing: 1.5px;
        text-transform: uppercase;
        transition: 0.3s;
        width: 100%;
        cursor: pointer;
    }
    .toggle-qid:hover { color: #000000; }

    .forgot-pass { color: #94a3b8; font-size: 12px; text-decoration: none; display: block; margin-top: 25px; font-weight: 600; }
    .forgot-pass:hover { color: var(--text-dark); }

    /* Mobile Tweaks */
    @media (max-width: 480px) {
        .portal-card { padding: 40px 25px; margin: 20px; }
        .action-link { padding: 14px; }
    }
</style>

<div class="floating-container">
    <i class="fa fa-book float-item item-1"></i>
    <i class="fa fa-pencil float-item item-2"></i>
    <i class="fa fa-graduation-cap float-item item-3"></i>
    <i class="fa fa-lightbulb float-item item-4"></i>
</div>

<div class="portal-card animate__animated animate__zoomIn">
    <div class="logo-box">
        <img src="{% static 'logo/quminity.png' %}" alt="Quminity">
    </div>

    <h2 class="fw-800 mb-1" style="letter-spacing: -0.5px;">System Access</h2>
    <p class="small mb-4 fw-bold" style="color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase;">Identity Gateway</p>

    <div class="action-group">
        <a href="{% url 'face_login_page' %}" class="action-link btn-face">
            <div class="icon-box"><i class="fa fa-user"></i></div>
            <div class="text-box">
                <b>FACE LOGIN</b>
                <span>Fast Login Through Face</span>
            </div>
        </a>

        <a href="{% url 'face_register_page' %}" class="action-link">
            <div class="icon-box"><i class="fa fa-user-plus"></i></div>
            <div class="text-box">
                <b>ENROLL IDENTITY</b>
                <span>Create Your User profile</span>
            </div>
        </a>
    </div>

    <button class="toggle-qid" type="button">
        <i class="fa fa-keyboard me-1"></i> Use QID & Password
    </button>

    <a href="#" class="forgot-pass">Recover credentials?</a>
</div>

{% endblock %}
