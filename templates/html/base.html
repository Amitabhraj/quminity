{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quminity | Secure Access{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');

        :root {
            --bg-main: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --accent-primary: #0ea5e9;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.03) 0px, transparent 50%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-dark);
            margin: 0;
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-logo { height: 60px; transition: 0.3s; filter: contrast(1.1); }

        .main-wrapper {
            padding-top: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 40px);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid white;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

<nav class="navbar fixed-top">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="/">
            <img src="{% static 'logo/quminity.png' %}" class="nav-logo">
        </a>
        <div class="status-indicator d-flex align-items-center gap-2">
            <span class="small text-muted fw-bold" style="letter-spacing: 1px;">SECURE CHANNEL</span>
            <div class="rounded-circle bg-success" style="width: 8px; height: 8px; box-shadow: 0 0 8px rgba(25, 135, 84, 0.4);"></div>
        </div>
    </div>
</nav>

<main class="main-wrapper container">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
