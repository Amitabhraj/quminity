{% extends 'html/base.html' %}
{% load static %}

{% block extra_css %}
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.95);
        --accent: #4f46e5;
        --success: #10b981;
        --error: #ef4444;
    }

    .scan-container {
        max-width: 400px;
        margin: 2rem auto;
        padding: 1rem;
    }

    .compact-card {
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 28px;
        padding: 1.5rem;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        text-align: center;
    }

    .viewfinder {
        position: relative;
        width: 100%;
        aspect-ratio: 1/1;
        background: #000;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 1.25rem;
    }

    /* Flip Camera Button Overlay */
    .flip-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        z-index: 10;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
    }
    .flip-btn:hover { background: rgba(255, 255, 255, 0.4); }

    .laser {
        position: absolute;
        left: 5%;
        width: 90%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        box-shadow: 0 0 10px var(--accent);
        z-index: 5;
        animation: scan 2s linear infinite;
    }

    @keyframes scan {
        0% { top: 10%; opacity: 0; }
        10%, 90% { opacity: 1; }
        100% { top: 90%; opacity: 0; }
    }

    .status-area {
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        border-radius: 15px;
        text-transform: uppercase;
    }

    .status-searching { color: #4b5563; background: #f3f4f6; }
    .status-success { color: #fff; background: var(--success); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .status-error { color: #fff; background: var(--error); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
</style>
{% endblock %}

{% block content %}
<div class="scan-container">
    <div class="compact-card">
        <div class="mb-3">
            <h4 class="fw-bold m-0">Event Check-in</h4>
            <p class="text-muted small m-0">Center the QR code to scan</p>
        </div>

        <div class="viewfinder">
            <button class="flip-btn" id="flip-btn" title="Switch Camera">
                <i class="fa fa-sync"></i>
            </button>
            <div class="laser"></div>
            <div id="qr-reader"></div>
            <canvas id="hidden-canvas" style="display:none;"></canvas>
        </div>

        <div id="msg" class="status-area status-searching">
            <i class="fa fa-spinner fa-spin me-2"></i>Initializing...
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
    const qrCode = new Html5Qrcode("qr-reader");
    const msgElement = document.getElementById("msg");
    const canvas = document.getElementById("hidden-canvas");
    let isProcessing = false;
    let scanInterval;
    let currentFacingMode = "environment"; // Default to back camera

    const config = { 
        fps: 25, 
        qrbox: (w, h) => { return { width: w * 0.75, height: h * 0.75 } },
        aspectRatio: 1.0
    };

    async function startScanning(mode) {
        try {
            // If already scanning, stop it first
            if (qrCode.isScanning) {
                await qrCode.stop();
            }
            
            await qrCode.start({ facingMode: mode }, config, () => {});
            msgElement.innerHTML = "FINDING QR CODE...";
            
            // Clear existing interval if any and start fresh
            if (scanInterval) clearInterval(scanInterval);
            scanInterval = setInterval(captureFrameAndSend, 300);
        } catch (err) {
            msgElement.innerHTML = "CAMERA ERROR";
            msgElement.className = "status-area status-error";
        }
    }

    document.getElementById('flip-btn').addEventListener('click', () => {
        currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
        startScanning(currentFacingMode);
    });

    function captureFrameAndSend() {
        if (isProcessing) return;

        const video = document.querySelector("#qr-reader video");
        if (!video || video.readyState !== 4) return;

        const ctx = canvas.getContext('2d');
        canvas.width = 480;
        canvas.height = 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const frameData = canvas.toDataURL("image/jpeg", 0.5);

        isProcessing = true;
        fetch("/api/validate-attendance/", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: `frame=${encodeURIComponent(frameData)}`
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                clearInterval(scanInterval);
                msgElement.innerHTML = `${data.message}`;
                msgElement.className = "status-area status-success";
                if (navigator.vibrate) navigator.vibrate(100);
                setTimeout(() => window.location.href = "/", 2000);
            } else {
                msgElement.innerHTML = data.message;
                msgElement.className = (data.status === "error" || data.status === "expired") 
                    ? "status-area status-error" 
                    : "status-area status-searching";
                isProcessing = false;
            }
        })
        .catch(() => { isProcessing = false; });
    }

    document.addEventListener("DOMContentLoaded", () => startScanning(currentFacingMode));
</script>
{% endblock %}
