{% extends 'html/base.html' %}
{% load static %}

{% block title %}Quminity | Event QR{% endblock %}

{% block extra_css %}
<style>
    :root {
        --accent-primary: #667eea;
        --accent-secondary: #764ba2;
        --glass-bg: rgba(255, 255, 255, 0.95);
    }

    .qr-page-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 24px;
        padding: 25px; /* Reduced padding */
        width: 90%;
        max-width: 400px; /* Made the whole box smaller */
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }

    .event-title {
        font-size: 1.4rem; /* Smaller font */
        font-weight: 800;
        margin-bottom: 5px;
        background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .qr-container {
        position: relative;
        margin: 20px auto;
        width: 100%;
        max-width: 280px; /* Slightly larger for better visibility */
        aspect-ratio: 1/1;
        background: white;
        padding: 15px; /* More white space helps sensors focus */
        border-radius: 12px;
        /* Force crisp pixels for low-res screens */
        image-rendering: pixelated; 
        border: 4px solid #f3f4f6;
    }

    #qr-img {
        width: 100%;
        height: 100%;
        display: block;
        /* Contrast boost helps low-quality cameras see the black/white difference */
        filter: contrast(1.1); 
    }

    .status-mini {
        font-size: 0.85rem;
        color: #6b7280;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .refresh-dot {
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.5; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
{% endblock %}

{% block content %}
<div class="qr-page-wrapper">
    <div class="glass-card">
        <h1 class="event-title">{{ event.event }}</h1>
        <div class="text-muted small">{{ event.event_date }}</div>

        <div class="qr-container">
            <img id="qr-img" alt="QR Code">
            <div id="qr-loading" ...>
                <i class="fa fa-sync fa-spin fa-2x text-primary"></i>
            </div>
        </div>

        <div class="status-mini">
            <div class="refresh-dot"></div>
            <span id="status-text">QR is Active</span>
        </div>

        <div class="mt-4">
            <a href="/" class="text-decoration-none text-muted small fw-bold">
                <i class="fa fa-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function refreshQR() {
    const img = document.getElementById('qr-img');
    const loading = document.getElementById('qr-loading');
    
    loading.style.display = 'block';
    
    fetch("/api/GenerateAttendanceQR/{{ event.id }}/")
        .then(res => res.json())
        .then(data => {
            img.src = "data:image/png;base64," + (data.qr || data.qr_image);
            loading.style.display = 'none';
            
            // Auto refresh based on backend expiry (e.g., 3s)
            setTimeout(refreshQR, (data.expires_in || 3) * 1000);
        })
        .catch(() => {
            setTimeout(refreshQR, 5000); // Retry on error
        });
}

document.addEventListener('DOMContentLoaded', refreshQR);
</script>
{% endblock %}
